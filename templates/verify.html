<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runcast</title>
<style>
{% include "_tokens.css.html" %}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
header h1{font-size:17px}
header h1 a{color:var(--text)}
header h1 span{color:var(--accent)}
main{max-width:420px;margin:64px auto;padding:0 24px;text-align:center}
.notice{border-radius:8px;padding:18px;font-size:14px;line-height:1.6}
.notice.ok{background:rgba(63,185,80,.12);border:1px solid var(--accent2);color:var(--accent2)}
.notice.err{background:rgba(248,81,73,.12);border:1px solid var(--hot);color:var(--hot)}
p.next{margin-top:16px}
</style>
</head>
<body>
<header><h1><a href="/">Runcast <span>{{ 'Launcher' if lang == 'en' else '런처' }}</span></a></h1></header>
<main>
  <div class="notice {{ 'ok' if ok else 'err' }}">
    {{ t('auth.verify_success') if ok else t('auth.verify_invalid') }}
  </div>
  <p class="next"><a href="{{ '/login' if ok else '/signup' }}">
    {{ t('auth.login') if ok else t('auth.signup') }} →</a></p>
</main>
</body>
</html>
